<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="500" cy="500" r="500" fill="#FF4500"/>
  
  <!-- Analytics Background -->
  <path d="M200 700l100-300l160 160l120-400l140 240l80-160l120 460" 
        stroke="#FFFFFF" stroke-width="30" stroke-opacity="0.3" fill="none"/>
  
  <!-- Reddit Alien with Glasses -->
  <g transform="translate(250, 250) scale(2.5)">
    <!-- Antenna -->
    <path d="M15 5c0-2.76 2.24-5 5-5s5 2.24 5 5v5" 
          stroke="#FFFFFF" stroke-width="8"/>
    
    <!-- Head -->
    <circle cx="20" cy="15" r="10" fill="#FFFFFF"/>
    
    <!-- Smart Glasses -->
    <path d="M13 15h14" stroke="#FF4500" stroke-width="3"/>
    <circle cx="15" cy="15" r="3" fill="#FF4500"/>
    <circle cx="25" cy="15" r="3" fill="#FF4500"/>
    
    <!-- Data Points on Glasses -->
    <circle cx="15" cy="15" r="1" fill="#FFFFFF"/>
    <circle cx="25" cy="15" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Mini Bar Chart -->
  <g transform="translate(650, 600) scale(3)">
    <rect x="0" y="8" width="4" height="24" fill="#FFFFFF" opacity="0.9"/>
    <rect x="6" y="0" width="4" height="32" fill="#FFFFFF" opacity="0.9"/>
    <rect x="12" y="12" width="4" height="20" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg> 